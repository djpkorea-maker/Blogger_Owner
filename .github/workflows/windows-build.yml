name: R3 Windows development build
on:
  workflow_dispatch:
  push:
    branches: [main, dev74-research-recovery]
    paths:
      - '**.py'
      - '**.pyw'
      - 'r3studio/**'
      - 'bridge/**'
      - 'requirements*.txt'
      - '.github/workflows/windows-build.yml'
concurrency:
  group: r3-windows-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check build environment
        run: python build_preflight.py
      - name: Test and build development executables
        run: python build_windows.py
      - name: Retain unverified development bundle
        uses: actions/upload-artifact@v4
        with:
          name: R3_0_Windows_Dev89_Test
          path: release/R3_0_Windows_Dev_*/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
      - name: Download uploaded development bundle
        uses: actions/download-artifact@v4
        with:
          name: R3_0_Windows_Dev89_Test
          path: artifact_check/내려받은_시험판
      - name: Verify downloaded bundle and run extracted executables
        run: python verify_downloaded_artifact.py artifact_check/내려받은_시험판 --smoke-test
